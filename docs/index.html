<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard</title>
<style>
:root{--bg:#000;--card:#0d0f12;--tx:#eef1f4;--dim:#7d8792;--ok:#3ddc84;--warn:#ffc233;--bad:#ff5a5f;--acc:#5ab0ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:grid;gap:10px;padding:12px;grid-template-columns:1fr 1fr 1fr 1.15fr;grid-template-rows:auto 1fr 1fr;
grid-template-areas:"head head head head" "wx wx air agenda" "fuel fuel elec agenda"}
.card{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0;min-height:0;overflow:hidden}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
#head{grid-area:head;display:flex;align-items:baseline;gap:18px;background:none;padding:0 4px}
#clock{font-size:clamp(40px,9vh,64px);font-weight:300;line-height:1}
#date{font-size:16px;color:var(--dim);text-transform:capitalize;flex:1}
#bat{font-size:15px;color:var(--dim)} #bat.low{color:var(--bad);font-weight:700}
#wx{grid-area:wx} #air{grid-area:air} #fuel{grid-area:fuel} #elec{grid-area:elec} #agenda{grid-area:agenda}
#agb{font-size:14px;line-height:1.35}.dl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:6px 0 3px}
.ev{display:flex;gap:7px;align-items:baseline;padding:2px 0;min-width:0}.ev i{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.ev .tm{color:var(--dim);flex:none;min-width:46px;font-variant-numeric:tabular-nums}.ev .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.live .tm{color:var(--ok)}.none{color:var(--dim);font-size:13px}.tk{display:flex;gap:7px;padding:2px 0}.tk .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tk.od{color:var(--bad)}.tk.nd{color:var(--dim)}
.now{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.now .big{font-size:clamp(36px,8vh,54px);font-weight:300}.now .ic{font-size:clamp(34px,7vh,48px)}
.now .sub{color:var(--dim);font-size:14px;line-height:1.4}
.hours{display:flex;gap:6px;overflow:hidden}
.h{flex:1;text-align:center;font-size:13px;min-width:0}.h .t{color:var(--dim)}.h .i{font-size:22px;margin:2px 0}.h .r{color:var(--acc);font-size:12px;min-height:14px}
.aq{font-size:clamp(34px,7vh,48px);font-weight:300}.lab{font-size:15px;margin-bottom:4px}
.pol{font-size:14px;color:var(--dim);margin-top:6px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tile{background:#15181d;border-radius:12px;padding:10px;cursor:pointer}.tile:active{background:#20252c}
.tile .n{font-size:12px;color:var(--dim)}.tile .p{font-size:clamp(20px,4.4vh,30px);font-weight:500;margin:2px 0}.tile .s{font-size:11px;color:var(--dim);line-height:1.3}
.up{color:var(--bad)}.dn{color:var(--ok)}
.g{color:var(--ok)}.y{color:var(--warn)}.r{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;padding:16px;z-index:9;flex-direction:column}
#modal.on{display:flex}
#mh{display:flex;align-items:center;gap:10px;margin-bottom:8px}#mh h3{flex:1;font-size:18px;font-weight:500}
.btn{background:#20252c;color:var(--tx);border:0;border-radius:10px;padding:8px 14px;font-size:14px}.btn.on{background:var(--acc);color:#000}
#chart{flex:1;min-height:0}#note{color:var(--dim);font-size:13px;margin-top:6px}
@media (orientation:portrait){#app{grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,auto);
grid-template-areas:"head head" "wx wx" "air elec" "fuel fuel" "agenda agenda";overflow:auto}html,body{overflow:auto}}
</style>
</head>
<body>
<div id="app">
  <div id="head" class="card"><div id="clock">--:--</div><div id="date"></div><button id="surv" class="btn" style="display:none" onclick="toggleSurv()"></button><div id="bat"></div></div>
  <div id="wx" class="card"><h2 id="wxh">Météo</h2><div id="wxb"></div></div>
  <div id="air" class="card"><h2>Air &amp; pollens</h2><div id="airb"></div></div>
  <div id="fuel" class="card"><h2 id="fuelh">Carburants</h2><div id="fuelb" class="tiles"></div></div>
  <div id="elec" class="card"><h2>Électricité (prix spot)</h2><div id="elecb"></div></div>
  <div id="agenda" class="card"><h2>Agenda &amp; tâches</h2><div id="agb"></div></div>
</div>
<div id="modal"><div id="mh"><h3 id="mt"></h3><span id="mb"></span><button class="btn" onclick="closeM()">Fermer</button></div>
<div id="chart"></div><div id="note"></div></div>

<script>
const $=s=>document.querySelector(s);
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={cfg:ls.get('cfg'),wx:ls.get('wx'),air:ls.get('air'),fuel:ls.get('fuel'),fh:ls.get('fh'),el:ls.get('el'),eh:ls.get('eh'),ag:ls.get('ag')};
const FN={gazole:'Gazole',sp95:'SP95',e10:'SP95-E10',sp98:'SP98',e85:'E85',gplc:'GPLc'};
const WC=c=>c===0?'☀️':c<=2?'⛅':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
const WT=c=>c===0?'Dégagé':c<=2?'Peu nuageux':c===3?'Couvert':c<=48?'Brouillard':c<=57?'Bruine':c<=67?'Pluie':c<=77?'Neige':c<=82?'Averses':c<=86?'Averses de neige':'Orage';

async function getJ(key,urls){
  for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();ls.set(key,j);S[key]=j;return j}catch(e){}}
  return S[key];
}
async function refresh(){
  await getJ('cfg',['config.json']);render();
  const c=S.cfg;if(!c)return;
  const b=`latitude=${c.latitude}&longitude=${c.longitude}&timezone=${encodeURIComponent(c.timezone)}&forecast_days=2`;
  await Promise.all([
    getJ('wx',[`https://api.open-meteo.com/v1/forecast?${b}&models=meteofrance_seamless&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset`,'data/weather.json']),
    getJ('air',[`https://air-quality-api.open-meteo.com/v1/air-quality?${b}&current=european_aqi,pm10,pm2_5&hourly=european_aqi,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen`,'data/air.json']),
    getJ('fuel',['data/fuel.json']),getJ('fh',['data/fuel_history.json']),
    getJ('el',['data/electricity.json']),getJ('eh',['data/electricity_history.json']),loadAgenda()
  ]);
  render();
}

function clock(){
  const d=new Date();
  $('#clock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  $('#date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+(S.cfg?' · '+S.cfg.city:'');
}
function renderWx(){
  const w=S.wx;if(!w||!w.current)return;
  const cur=w.current,H=w.hourly,D=w.daily;
  let i=H.time.findIndex(t=>t>=cur.time.slice(0,13));if(i<0)i=0;
  const hrs=[];for(let k=i;k<Math.min(i+10,H.time.length);k++)hrs.push(`<div class="h"><div class="t">${H.time[k].slice(11,13)}h</div><div class="i">${WC(H.weather_code[k])}</div><div>${Math.round(H.temperature_2m[k])}°</div><div class="r">${H.precipitation_probability[k]>=20?H.precipitation_probability[k]+'%':''}</div></div>`);
  $('#wxb').innerHTML=`<div class="now"><span class="ic">${WC(cur.weather_code)}</span><span class="big">${Math.round(cur.temperature_2m)}°</span>
  <div class="sub">${WT(cur.weather_code)} · ressenti ${Math.round(cur.apparent_temperature)}°<br>Min ${Math.round(D.temperature_2m_min[0])}° / Max ${Math.round(D.temperature_2m_max[0])}° · vent ${Math.round(cur.wind_speed_10m)} km/h (raf. ${Math.round(cur.wind_gusts_10m)})<br>☀ ${D.sunrise[0].slice(11)} → ${D.sunset[0].slice(11)}</div></div><div class="hours">${hrs.join('')}</div>`;
}
function renderAir(){
  const a=S.air;if(!a||!a.current)return;
  const q=a.current.european_aqi,
  [t,c]=q<=20?['Bon','g']:q<=40?['Correct','g']:q<=60?['Moyen','y']:q<=80?['Médiocre','r']:['Mauvais','r'];
  const H=a.hourly,now=a.current.time.slice(0,13),names={alder:'aulne',birch:'bouleau',grass:'graminées',mugwort:'armoise',olive:'olivier',ragweed:'ambroisie'};
  const i=Math.max(0,H.time.findIndex(x=>x>=now)),act=[];
  for(const k in names){const v=(H[k+'_pollen']||[])[i];if(v>=1)act.push([names[k],v]);}
  act.sort((x,y)=>y[1]-x[1]);
  $('#airb').innerHTML=`<div class="aq ${c}">${q}</div><div class="lab ${c}">Qualité de l'air : ${t}</div>
  <div class="pol">${act.length?'Pollens : '+act.map(([n,v])=>`<span class="${v>=50?'r':v>=10?'y':'g'}">${n} ${Math.round(v)}</span>`).join(' · '):'Pollens : aucun niveau notable'}<br>PM2.5 ${a.current.pm2_5} · PM10 ${a.current.pm10} µg/m³</div>`;
}
function renderFuel(){
  const f=S.fuel;if(!f)return;
  $('#fuelh').textContent=`Carburants · ${f.city} ${f.radius_km} km · appuie pour le graphique`;
  const days=(S.fh&&S.fh.days)||[],prev=days.length>1?days[days.length-2].fuels:{};
  $('#fuelb').innerHTML=Object.keys(f.summary).filter(k=>k!=='gplc').map(k=>{
    const s=f.summary[k],p=prev[k]&&prev[k].min,d=p?s.min-p:0;
    const tr=!p||Math.abs(d)<0.0005?'':d>0?`<span class="up">▲ ${d.toFixed(3)}</span>`:`<span class="dn">▼ ${(-d).toFixed(3)}</span>`;
    return `<div class="tile" onclick="fuelChart('${k}')"><div class="n">${FN[k]}</div><div class="p">${s.min.toFixed(3)} €</div><div class="s">moy. ${s.avg.toFixed(3)} ${tr}<br>${s.cheapest_km??'?'} km</div></div>`}).join('');
}
function elNow(){
  const h=(S.el&&S.el.hourly)||[],n=Date.now();let cur=null;
  for(const x of h){if(new Date(x.t).getTime()<=n)cur=x;else break}return cur;
}
function renderElec(){
  const h=(S.el&&S.el.hourly)||[];if(!h.length)return;
  const td=new Date().toLocaleDateString('sv-SE'),day=h.filter(x=>x.t.slice(0,10)===td).map(x=>x.c_kwh),c=elNow();
  const avg=day.reduce((a,b)=>a+b,0)/(day.length||1),v=c?c.c_kwh:avg,col=v<=avg*.8?'g':v>=avg*1.2?'r':'y';
  $('#elecb').innerHTML=`<div class="tile" onclick="elecChart()"><div class="n">Maintenant</div><div class="p ${col}">${v.toFixed(1)} c€/kWh</div><div class="s">Aujourd'hui : min ${Math.min(...day).toFixed(1)} · moy ${avg.toFixed(1)} · max ${Math.max(...day).toFixed(1)}<br>Prix de gros, hors taxes · appuie pour le graphique</div></div>`;
}
/* ---- agenda & tâches (l'URL vient de l'app Android, jamais de GitHub) ---- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=d=>d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
let agMsg='';
function loadAgenda(){
  if(!(window.Android&&Android.refreshAgenda)){agMsg='App Android à réinstaller (nouvelle version requise)';return}
  if(!Android.hasAgenda()){agMsg='AGENDA_URL est vide dans Secrets.kt';return}
  agMsg='Chargement…';Android.refreshAgenda();
}
function onAgenda(str){
  try{const j=JSON.parse(str);
    if(j.events){S.ag=j;ls.set('ag',j);agMsg=''}
    else agMsg=j.error==='unauthorized'?'Jeton refusé : différent de celui du script':'Erreur : '+(j.error||'réponse inattendue')}
  catch(e){agMsg='Réponse illisible (page Google au lieu des données ?)'}
  renderAgenda()
}
function renderAgenda(){
  const el=$('#agb');if(!el)return;const a=S.ag;
  if(!a){el.innerHTML='<div class="none">'+esc(agMsg||'Agenda non configuré')+'</div>';return}
  const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),d1=new Date(d0.getTime()+864e5),d2=new Date(d0.getTime()+2*864e5);
  const ev=a.events.map(e=>Object.assign({},e,{s:new Date(e.start),e2:new Date(e.end)}));
  const day=(f,t)=>ev.filter(e=>e.s<t&&e.e2>f).sort((x,y)=>(y.allDay-x.allDay)||(x.s-y.s));
  const row=e=>{const live=!e.allDay&&e.s<=now&&e.e2>now;
    return `<div class="ev ${live?'live':''}"><i style="background:${esc(e.color||'#5ab0ff')}"></i><span class="tm">${e.allDay?'Journée':hm(e.s)}</span><span class="ti">${esc(e.title)}</span></div>`};
  const T=day(d0,d1).filter(e=>e.allDay||e.e2>=now),M=day(d1,d2);
  let h='<div class="dl">Aujourd\'hui</div>'+(T.length?T.slice(0,5).map(row).join(''):'<div class="none">Plus rien de prévu</div>');
  if(M.length)h+='<div class="dl">Demain</div>'+M.slice(0,3).map(row).join('');
  const td=d0.toLocaleDateString('sv-SE');
  const due=(a.tasks||[]).filter(t=>t.due&&t.due<=td).sort((x,y)=>x.due<y.due?-1:1),und=(a.tasks||[]).filter(t=>!t.due).slice(0,2);
  const tk=due.map(t=>`<div class="tk ${t.due<td?'od':''}"><span>☐</span><span class="ti">${esc(t.title)}</span></div>`).concat(und.map(t=>`<div class="tk nd"><span>☐</span><span class="ti">${esc(t.title)}</span></div>`)).slice(0,5);
  if(tk.length)h+='<div class="dl">À faire</div>'+tk.join('');
  el.innerHTML=h;
}
function render(){clock();renderWx();renderAir();renderFuel();renderElec();renderAgenda()}

/* ---- graphiques SVG ---- */
function line(series,{xl}){
  const W=900,Hh=380,m={l:54,r:14,t:14,b:30};
  const all=series.flatMap(s=>s.pts.map(p=>p[1]));if(!all.length)return '';
  let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<1e-6){lo-=1;hi+=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const n=Math.max(...series.map(s=>s.pts.length)),X=i=>m.l+(n<2?(W-m.l-m.r)/2:i*(W-m.l-m.r)/(n-1)),Y=v=>Hh-m.b-(v-lo)/(hi-lo)*(Hh-m.t-m.b);
  let o=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-size="13" fill="#7d8792">`;
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);o+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#20252c"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${v.toFixed(xl.dec)}</text>`}
  const lab=series[0].pts;[0,Math.floor((lab.length-1)/2),lab.length-1].forEach((i,k)=>{if(lab[i])o+=`<text x="${X(i)}" y="${Hh-8}" text-anchor="${k==0?'start':k==2?'end':'middle'}">${lab[i][0]}</text>`});
  series.forEach(s=>{const d=s.pts.map((p,i)=>`${X(i)},${Y(p[1])}`).join(' ');
    o+=`<polyline points="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.step?'':'stroke-linejoin="round"'}/>`;
    if(s.pts.length<=45)s.pts.forEach((p,i)=>o+=`<circle cx="${X(i)}" cy="${Y(p[1])}" r="3.5" fill="${s.color}"/>`);
    const mn=s.pts.reduce((a,b)=>b[1]<a[1]?b:a),mx=s.pts.reduce((a,b)=>b[1]>a[1]?b:a);
  });
  return o+'</svg>';
}
let cur=null;
function openM(title,btns,draw){$('#mt').textContent=title;$('#mb').innerHTML=btns.map((b,i)=>`<button class="btn ${i==0?'on':''}" onclick="pick(${i})">${b}</button>`).join(' ');cur={draw,n:btns.length};pick(0);$('#modal').classList.add('on')}
function pick(i){[...$('#mb').children].forEach((b,k)=>b.classList.toggle('on',k===i));cur.draw(i)}
function closeM(){$('#modal').classList.remove('on')}
function fuelChart(k){
  const days=(S.fh&&S.fh.days)||[],R=[7,30,90];
  openM(`${FN[k]} · ${S.fh.city}`,['7 j','30 j','90 j'],i=>{
    const d=days.filter(x=>x.fuels[k]).slice(-R[i]);
    $('#chart').innerHTML=line([{color:'#5ab0ff',pts:d.map(x=>[x.date.slice(5),x.fuels[k].min])},{color:'#7d8792',pts:d.map(x=>[x.date.slice(5),x.fuels[k].avg])}],{xl:{dec:3}});
    $('#note').textContent=`Bleu : prix le plus bas · gris : prix moyen · ${d.length} jour(s) d'historique`+(d.length<3?' — l\'historique se construit jour après jour.':'');
  });
}
function elecChart(){
  openM('Électricité · prix spot France (c€/kWh)',['Heures','Jours'],i=>{
    if(i==0){const h=S.el.hourly.filter(x=>x.t.slice(0,10)>=new Date().toLocaleDateString('sv-SE'));
      $('#chart').innerHTML=line([{color:'#ffc233',step:1,pts:h.map(x=>[x.t.slice(5,10)+' '+x.t.slice(11,16),x.c_kwh])}],{xl:{dec:1}});
      $('#note').textContent='Aujourd\'hui et demain (demain publié vers 13 h).'}
    else{const d=(S.eh&&S.eh.days||[]).slice(-90);
      $('#chart').innerHTML=line([{color:'#ffc233',pts:d.map(x=>[x.date.slice(5),x.avg])},{color:'#7d8792',pts:d.map(x=>[x.date.slice(5),x.max])}],{xl:{dec:1}});
      $('#note').textContent='Jaune : moyenne du jour · gris : maximum du jour.'}
  });
}

/* ---- surveillance (bouton visible seulement dans l'app Android) ---- */
let SV=false;
function setSurv(v){SV=v;const b=$('#surv');if(!b)return;b.style.display='';b.textContent=v?'⏹ Arrêter la surveillance':'🔒 Je pars';b.className='btn'+(v?' on':'')}
function toggleSurv(){if(!window.Android)return;if(SV){Android.stopSurveillance();setSurv(false)}else Android.startSurveillance()}
if(window.Android)setSurv(Android.isSurveillance());

/* ---- batterie, cycle de vie ---- */
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{const p=Math.round(b.level*100),e=$('#bat');e.textContent=(b.charging?'⚡ ':'🔋 ')+p+' %';e.className=(!b.charging&&p<25)?'low':''};u();b.onlevelchange=b.onchargingchange=u});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();refresh()}});
setInterval(clock,1000);setInterval(renderAgenda,60000);setInterval(refresh,10*60*1000);
render();refresh();
</script>
</body>
</html>
