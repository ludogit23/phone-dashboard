name: Collecte des données

on:
  schedule:
    - cron: "15 */3 * * *"     # météo/air : toutes les 3 h
    - cron: "30 5,13 * * *"    # carburants + électricité (l'élec du lendemain sort vers 13 h)
  workflow_dispatch:
  push:
    paths: ["docs/config.json"]   # changement de ville -> régénération immédiate

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Météo et air
        run: python scripts/fetch_weather_air.py
        continue-on-error: true

      - name: Carburants et électricité
        if: github.event.schedule != '15 */3 * * *'
        run: |
          python scripts/fetch_fuel.py
          python scripts/fetch_electricity.py
        continue-on-error: true

      - name: Commit des données
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: mise à jour $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
